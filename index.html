<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: fill;     /* Растягивает видео на всю область без сохранения пропорций */
            opacity: 0;
            transition: opacity 0.5s ease-in;
            display: block;
            pointer-events: none;  /* Дополнительная защита: отключаем любые взаимодействия с видео */
        }

        /* Класс, активирующий fade in */
        video.fade-in {
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="video-container">
    <video id="bgVideo" muted playsinline disablePictureInPicture>
        <source src="IMG_3872.MP4" type="video/mp4">
        <!-- Браузеры не поддерживающие mp4 — ничего не делаем, но фон остается черным -->
    </video>
</div>

<script>
    (function() {
        const video = document.getElementById('bgVideo');

        // Функция для немедленного редиректа после полного окончания видео
        function redirectToGemini() {
            window.location.href = "https://gemini.google.com/";
        }

        // Убедимся, что видео существует, и настроим события
        if (video) {
            // Когда видео готово к воспроизведению (загружено достаточно данных)
            video.addEventListener('canplaythrough', function() {
                // Запускаем воспроизведение
                video.play().then(() => {
                    // Как только видео начало воспроизводиться, добавляем класс fade-in для плавного появления (0.5 сек)
                    video.classList.add('fade-in');
                }).catch(e => {
                    // Некоторые браузеры могут блокировать автовоспроизведение из-за политики,
                    // но muted помогает обойти это; если все же ошибка — делаем попытку вручную
                    console.warn("Autoplay error, trying fallback:", e);
                    video.play().then(() => video.classList.add('fade-in')).catch(() => {});
                });
            });

            // На случай, если видео уже загружено или событие canplaythrough не сработало быстро
            if (video.readyState >= 3) { // HAVE_FUTURE_DATA или HAVE_ENOUGH_DATA
                video.play().then(() => video.classList.add('fade-in')).catch(() => {});
            } else {
                video.load(); // гарантируем загрузку
            }

            // Основное событие: когда видео полностью проиграно (достигнут конец)
            video.addEventListener('ended', function() {
                // Немедленный редирект после завершения видео
                redirectToGemini();
            });
        } else {
            // Если по какой-то причине видео не найдено, но по структуре документа оно должно быть,
            // просто редирект для безопасности не делаем, так как видео отсутствует — условие задачи требует видео.
            // Но на всякий случай: если видео нет, можно ничего не делать или выполнить редирект? Нет, по условию
            // видео должно быть, но в случае ошибки консоль.
        }
    })();
</script>
</body>
</html>
