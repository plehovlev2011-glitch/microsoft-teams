<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 3;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .white-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="video-container" id="videoContainer">
    <video id="mainVideo" preload="auto" disablepictureinpicture controlslist="nodownload" muted>
        <source src="IMG_3872.MP4" type="video/mp4">
    </video>
</div>
<div class="white-overlay" id="whiteOverlay"></div>
<script>
    (function() {
        const whiteOverlay = document.getElementById('whiteOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('mainVideo');
        let redirectTriggered = false;
        let videoEnded = false;
        function redirectToGemini() {
            if (redirectTriggered) return;
            redirectTriggered = true;
            window.location.replace('https://gemini.google.com');
        }
        function startVideoFadeIn() {
            videoContainer.style.transition = 'opacity 0.5s ease-in-out';
            videoContainer.style.opacity = '0';
            video.currentTime = 0;
            video.play().then(() => {
                videoContainer.style.opacity = '1';
            }).catch(() => {
                video.muted = true;
                video.play().then(() => {
                    videoContainer.style.opacity = '1';
                }).catch(() => {
                    videoContainer.style.opacity = '1';
                });
            });
            video.removeEventListener('ended', redirectToGemini);
            video.addEventListener('ended', function onEnded() {
                if (!videoEnded) {
                    videoEnded = true;
                    redirectToGemini();
                }
            });
        }
        whiteOverlay.style.transition = 'opacity 0.5s ease-in-out';
        whiteOverlay.style.opacity = '1';
        setTimeout(function() {
            whiteOverlay.style.opacity = '0';
            setTimeout(function() {
                whiteOverlay.style.display = 'none';
                startVideoFadeIn();
            }, 500);
        }, 600);
        video.controls = false;
        video.disableRemotePlayback = true;
        video.setAttribute('controlslist', 'nodownload');
        video.setAttribute('disablepictureinpicture', 'true');
        video.removeAttribute('autoplay');
        video.pause();
        video.currentTime = 0;
        video.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        video.style.webkitTouchCallout = 'none';
    })();
</script>
</body>
</html>
