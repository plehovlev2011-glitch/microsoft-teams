<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 3;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        .white-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .white-overlay.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
<div class="video-container" id="videoContainer">
    <video id="mainVideo" preload="auto" disablepictureinpicture controlslist="nodownload" muted>
        <source src="IMG_3872.MP4" type="video/mp4">
    </video>
</div>
<div class="white-overlay" id="whiteOverlay"></div>
<script>
    (function() {
        const whiteOverlay = document.getElementById('whiteOverlay');
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('mainVideo');
        let redirectTriggered = false;
        function redirectToGemini() {
            if (redirectTriggered) return;
            redirectTriggered = true;
            window.location.replace('https://gemini.google.com');
        }
        function startVideoFadeIn() {
            videoContainer.style.opacity = '0';
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    requestAnimationFrame(() => {
                        videoContainer.style.opacity = '1';
                    });
                }).catch(() => {
                    video.muted = true;
                    video.play().then(() => {
                        videoContainer.style.opacity = '1';
                    }).catch(() => {
                        videoContainer.style.opacity = '1';
                    });
                });
            } else {
                videoContainer.style.opacity = '1';
                video.play().catch(() => {});
            }
            video.removeEventListener('ended', redirectToGemini);
            video.addEventListener('ended', function onEnded() {
                redirectToGemini();
            });
        }
        function startFadeToBlack() {
            setTimeout(() => {
                whiteOverlay.classList.add('hidden');
                setTimeout(() => {
                    startVideoFadeIn();
                }, 600);
            }, 600);
        }
        video.controls = false;
        video.disableRemotePlayback = true;
        video.setAttribute('controlslist', 'nodownload');
        video.setAttribute('disablepictureinpicture', 'true');
        video.removeAttribute('autoplay');
        video.pause();
        video.currentTime = 0;
        window.addEventListener('load', function() {
            startFadeToBlack();
        });
        video.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        video.style.webkitTouchCallout = 'none';
        if (video.readyState >= 4 && video.currentTime >= video.duration) {
            redirectToGemini();
        }
        setTimeout(function() {
            if (video.currentTime >= video.duration - 0.1 && video.duration !== Infinity && !redirectTriggered) {
                redirectToGemini();
            }
        }, 100);
    })();
</script>
</body>
</html>
